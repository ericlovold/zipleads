# Profile: WHAT to look for. Telecom / connectivity: any business about to
# occupy a space needs internet and phone. Used for the Comcast Business
# Authorized Connector referral program, but not specific to it.

name = "Telecom: new and relocating businesses"

[news]
terms = [
  '"grand opening"', '"new location"', '"is opening"', '"to open"',
  "relocating", '"new headquarters"', '"signed a lease"', "expanding",
]
# Headlines (and outlets) that match the terms but are never a business lead.
# Seen in the first live week: high-school sports, pro sports, transit, politics.
exclude_terms = [
  "maxpreps", "varsity", "girls soccer", "boys soccer", "volleyball", "football", "hockey",
  "wild ", "vikings", "twins ", "timberwolves", "lynx", "frost", "tommies", "gophers", "pwhl",
  "season opener", "set to open the season", "open season", "opening round", "opening day",
  "light rail", "light-rail", "green line", "blue line", "metro transit", "amtrak", "bridge",
  "waterfowl", "deer season", "fishing", "hunting", "city council", "candidates", "election",
  "market forecast", "market size", "market to expand", "patent", "ranking at",
  "surgery for", "undergoes surgery", "after surgery", "skull", "injury",
  "opening for ", "concert", "tour dates", "museum", "church", "churches",
  "narrative", "shares", "stock", "(nyse", "(nasdaq", "simplywall", "jersey gardens", "new jersey",
  "manila times",
]

[permits]
include_terms = [
  "commercial", "tenant", "build-out", "buildout", "build out", "remodel",
  "office", "retail", "restaurant", "clinic", "warehouse", "new building",
  "new construction", "alteration", "interior",
]
# Coded permit-type / occupancy values that mean housing. Matched as whole tokens.
# Minneapolis: Comm (commercial), MFD (multi-family), TFD (two-family), SFD, Res.
exclude_types = ["mfd", "tfd", "sfd", "3to4", "res", "existres", "residential", "r2", "r3"]
# Trade-only work that is not a move-in signal, seen in the first live Minneapolis run.
exclude_terms = [
  "single family", "single-family", "residential", "duplex", "sfd", "adu",
  "roofwind", "reroof", "re-roof", "roofing", "antenna", "demolition", "wrecking",
  "solar", "siding", "fence", "signage", "parking lot", "elevator",
  # Repairs to an occupied building are not a move-in.
  "water damage", "fire damage", "storm damage", "disaster", "restoration",
  "repair", "replace existing", "replacement of", "like for like", "like-for-like",
  "replacing", "windows", "rooftop", "telecommunications equipment", "cell site", "generator",
]

[places]
queries = ["opening soon", "coming soon"]

[contacts]
# Ordered: earlier titles win when several people match.
titles = [
  "owner", "founder", "ceo", "president", "managing partner", "principal",
  "general manager", "office manager", "operations manager", "it manager",
  "practice manager", "director of operations", "controller",
]

[segments]
# Keyword scrub over company name, description, and Places primary type.
# exclude: dropped before storage. The program cannot pay on education.
exclude = ["school", "university", "college", "academy", "education", "school district", "preschool", "daycare"]
# deprioritize: kept and flagged for a human. Dental usually rides a Delta national
# agreement; hospitality has extra rules; franchises vary by brand.
deprioritize = [
  "dental", "dentist", "orthodont", "hotel", "motel", "resort", "lodging", "hospitality",
  "franchise", "hospital", "health system",  # hospitals are enterprise accounts
]
deprioritize_penalty = -20
# boost: segments that tend to buy fiber plus add-ons (average fiber deal $700+ versus
# $140 for "just internet").
boost = [
  "tenant improvement", "tenant finish", "tenant build", "buildout", "build-out", "build out",
  "new tenant", "office", "clinic", "medical center", "medical office", "surgery center",
  "surgical", "law firm", "law office", "attorney", "warehouse", "manufactur", "logistics",
  "engineering", "financial", "insurance", "accounting",
]
boost_bonus = 10

[score]
# Multi-site pays up to $5,000 in the referral program versus $1,500 single-site.
multi_site_bonus = 30
# Size tiers on the territory's value field: [minimum, bonus]. For Minneapolis that
# field is the permit FEE (no valuation published): a boiler swap is ~$85, a floor-wide
# tenant improvement is thousands. Provisional; recalibrate from `zipleads stats`.
# Live Minneapolis fees 2026-09-30: p50 $912, p75 $6.7k, p90 $51k, max $452k.
value_tiers = [[500, 5], [2000, 10], [10000, 20], [50000, 30]]
phone_bonus = 10
contact_bonus = 10
news_only_penalty = -5
unparsed_penalty = -10
[score.source_weights]
places_future = 40
permits = 30
google_news = 20

[export]
# Column order for the referral portal: contact, company, email, phone first.
columns = [
  "contact_name", "company_name", "contact_email", "phone",
  "address", "city", "state", "zip", "applicant", "value", "contact_title", "website",
  "signals", "sources", "signal_date", "evidence_url", "description",
  "score", "first_seen", "dedupe_key",
]
