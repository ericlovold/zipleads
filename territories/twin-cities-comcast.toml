# Permit layers in this territory. Minneapolis field names were confirmed against the
# live layer with `zipleads probe mpls_permits` on 2026-09-30. Saint Paul is unconfirmed.

[[permit_layers]]
name = "mpls_permits"
city = "Minneapolis"
url = "https://services.arcgis.com/afSMGVsC7QlRK1kZ/arcgis/rest/services/CCS_Permits/FeatureServer/0"
[permit_layers.fields]
applicant = "applicantName"
address = "Display"
permit_type = "permitType"
work_type = "workType"
description = "comments"
date = "issueDate"
# Minneapolis publishes no valuation (value is null); permit fees scale with
# project size by ordinance, so totalFees is the size proxy. Tiers in the profile.
value = "totalFees"
occupancy = "occupancyType"
permit_number = "permitNumber"
status = "status"
applicant_person = "fullName"
latitude = "Latitude"
longitude = "Longitude"

# Saint Paul: set url once the FeatureServer URL is confirmed from information.stpaul.gov
# ("View API Resources" on the Building Permits dataset). Blank url = skipped.
[[permit_layers]]
name = "stpaul_permits"
city = "Saint Paul"
url = ""
[permit_layers.fields]
applicant = "APPLICANT"
address = "ADDRESS"
permit_type = "PERMIT_TYPE"
work_type = "WORK_TYPE"
description = "DESCRIPTION"
date = "ISSUE_DATE"
value = "VALUATION"

# --- License applications ----------------------------------------------------
# A license application names the business and its owner before it opens.

# Saint Paul sends Class N license applications (liquor, entertainment, auto, etc.)
# to City Council as resolutions; read from the public Legistar API.
[[license_feeds]]
name = "stpaul_licenses"
type = "legistar"
client = "stpaul"
city = "Saint Paul"

# Minneapolis Business License data (Business License Data Explorer). Set url after
# `zipleads find-layers https://services.arcgis.com/afSMGVsC7QlRK1kZ/arcgis/rest/services license`
# and confirm the field names below with `zipleads probe mpls_licenses --sample 3`.
# Blank url = skipped.
[[license_feeds]]
name = "mpls_licenses"
type = "arcgis"
city = "Minneapolis"
url = ""
[license_feeds.fields]
business_name = "BUSINESS_NAME"
legal_name = "LEGAL_NAME"
address = "ADDRESS"
license_type = "LICENSE_TYPE"
date = "APPLICATION_DATE"
status = "CASE_STATUS"
description = "DESCRIPTION"
license_number = "CASE_NUMBER"
