[project]
name = "zipleads"
version = "0.1.0"
description = "Find new and relocating businesses by zip code, for any industry and any territory."
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "google-auth>=2.0"]

[project.scripts]
zipleads = "zipleads.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
